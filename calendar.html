  <nav class="coquette-nav">

  <div class="coquette-card" style="text-align: center;">
    <h2>Settembre 2026</h2>
    <p style="font-size: 13px; color: var(--pink-text-muted);">Pianificazione appelli e ricevimenti</p>
    
    <div style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; margin-top: 20px; font-size: 13px;">
      <b>Lun</b><b>Mar</b><b>Mer</b><b>Gio</b><b>Ven</b><b>Sab</b><b>Dom</b>
      <span></span><span></span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span>
      <span>6</span><span>7</span><span>8</span><span>9</span><span>10</span><span>11</span><span>12</span>
      <span>13</span><span>14</span><span>15</span><span>16</span><span>17</span><span>18</span><span>19</span>
      <span>20</span><span style="background: var(--pink-accent); color: white; border-radius: 50%;">21</span><span>22</span><span>23</span><span>24</span><span>25</span><span>26</span>
    </div>
  </div>

  <div class="coquette-card">
    <h2>Prossimi eventi 🌸</h2>
    <div style="margin-top: 15px; display: flex; flex-direction: column; gap: 10px;">
      <div style="background: var(--pink-bg); padding: 12px; border-radius: 14px; display: flex; justify-content: space-between; align-items: center;">
        <div>
          <b>Ricevimento prof.</b><br>
          <small style="color: var(--pink-text-muted);">22 settembre 2026 • 14:00</small>
        </div>
        <span style="background: #fff; padding: 4px 10px; border-radius: 10px; font-size: 11px;">appuntamento</span>
      </div>
    </div>
  </div>

  <div class="footer-text">Fatto con 🎀 per studentesse instancabili</div>
